name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Interpretation, provider chain, spec, official samples, end-to-end, stress
        run: python tests/run_all.py

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t campus-energy:ci .
      - name: Smoke test with no environment variables
        run: |
          docker run -d --name ce -p 8000:8000 campus-energy:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          python3 - <<'PY'
          import json, urllib.request
          case = json.load(open("samples/public_cases.json"))[0]
          req = urllib.request.Request("http://127.0.0.1:8000/optimize-energy",
                                       data=json.dumps(case).encode(),
                                       headers={"Content-Type": "application/json"})
          body = json.load(urllib.request.urlopen(req, timeout=60))
          assert len(body["hourly_plan"]) == 24
          print("\nPOST /optimize-energy ->", body["total_cost_bdt"], "BDT")
          PY
          test -z "$(docker exec ce ls -A /app/.env 2>/dev/null)"
      - name: Publish to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag campus-energy:ci "$IMAGE:latest"
          docker tag campus-energy:ci "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: http://${{ vars.VPS_HOST }}/health
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # The key is pinned server-side to deploy/ci-receive.sh: it can only hand
      # over this tarball, which is staged as a new release, health-checked, and
      # rolled back automatically if it does not come up.
      - name: Ship release
        run: |
          git archive --format=tar.gz HEAD app samples scripts tests requirements.txt \
            | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@${{ vars.VPS_HOST }} "${GITHUB_SHA::7}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify the public endpoint like the judge harness
        run: python scripts/check_deployment.py "http://${{ vars.VPS_HOST }}"
