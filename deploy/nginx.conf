upstream campus_energy {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Replace with your domain if you point one at this VPS; the judge can also
    # hit the raw IP, which "_" already accepts.
    server_name _;

    client_max_body_size 1m;
    access_log /var/log/nginx/campus-energy.access.log;
    error_log  /var/log/nginx/campus-energy.error.log;

    # The judge harness only calls these two, but everything is proxied so the
    # interactive docs at /docs stay reachable.
    location / {
        proxy_pass http://campus_energy;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # An LLM call plus the solve stays well under this; the ceiling only
        # exists so a stalled upstream fails cleanly instead of hanging.
        proxy_connect_timeout 10s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;

        proxy_buffering off;
    }
}
