# Rendered by deploy/setup.sh, which substitutes __SERVER_NAME__.
#
# Deliberately NOT a default_server: the VPS also serves other sites by domain
# name, and this block only answers requests addressed to its own server_name
# (the VPS IP, or a domain if you pass one to setup.sh).

upstream campus_energy {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 1m;
    access_log /var/log/nginx/campus-energy.access.log;
    error_log  /var/log/nginx/campus-energy.error.log;

    location / {
        proxy_pass http://campus_energy;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # An LLM call plus the solve stays well under this; the ceiling only
        # exists so a stalled upstream fails cleanly instead of hanging.
        proxy_connect_timeout 10s;
        proxy_send_timeout    75s;
        proxy_read_timeout    75s;

        proxy_buffering off;
    }
}
