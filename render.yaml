services:
  - type: web
    name: campus-energy-optimizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: XAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4-fast
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_TIMEOUT_SECONDS
        value: "20"
